  <div class="sg-row" data-theme="dark">
    <span class="rg-badge">Binnentrap</span>
    <span class="rg-badge rg-badge--outline">Buitentrap</span>
    <span class="rg-badge rg-badge--solid">Keldertrap</span>

    <span class="rg-badge rg-badge--success"><span class="rg-badge__dot"></span>Gepubliceerd</span>
