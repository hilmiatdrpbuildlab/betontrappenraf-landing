<!-- @dsCard group="Content" height=600 subtitle="Maatvoering: a spec list in mono and dimension lines laid over Raf's stair plan" -->
<div class="rg sg-pad-lg" data-theme="light">
  <div class="sg-grid-2" style="align-items: start">
    <div style="display: grid; gap: 16px">
      <span class="rg-eyebrow"><span class="rg-step-mark"></span>Maatvoering</span>
      <h3 class="t-h3">Kwartdraaiende trap</h3>
      <dl class="rg-specs">
        <div class="rg-specs__row"><dt>Type</dt><dd>Kwartdraaiend</dd></div>
        <div class="rg-specs__row"><dt>Aantrede, rechte treden</dt><dd>23 cm</dd></div>
        <div class="rg-specs__row"><dt>Maat op plan</dt><dd>1,00 m</dd></div>
        <div class="rg-specs__row"><dt>Optrede</dt><dd>op plan</dd></div>
      </dl>
      <div class="rg-dim" aria-label="Aantrede 23 centimeter" style="max-width: 200px; margin-top: 8px"><span class="rg-dim__line"></span><span class="rg-dim__label">23 cm</span><span class="rg-dim__line"></span></div>
      <span class="sg-example">Values read off the plan photo; confirm with Raf</span>
    </div>
    <figure style="display: grid; gap: 8px">
      <img src="/_blob/387261eab2d6f0b33138ec31c8cebacc" alt="Uitslag van een kwartdraaiende trap met de maat van elke trede in centimeter" loading="lazy" style="width: 100%; aspect-ratio: 1; object-fit: cover">
      <figcaption class="t-caption" style="color: var(--ink-faint)">Uitslag van de treden, elke maat in cm.</figcaption>
    </figure>
  </div>
</div>
