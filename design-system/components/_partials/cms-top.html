<div class="rg-cms__top">
  <button class="rg-btn rg-btn--ghost rg-btn--icon rg-cms__burger" type="button" aria-label="Menu openen" aria-expanded="false">{{icon:menu}}</button>
  <div class="rg-cms__search rg-input-wrap">{{icon:search}}<input class="rg-input" type="search" placeholder="Zoek in realisaties, aanvragen en media" aria-label="Zoeken"></div>
  <div class="rg-cms__topactions">
    <button class="rg-btn rg-btn--ghost rg-btn--icon" type="button" aria-label="Donkere modus" aria-pressed="$DARK" data-rg-theme-toggle>{{icon:moon}}</button>
    <button class="rg-btn rg-btn--ghost rg-btn--icon" type="button" aria-label="Meldingen">{{icon:bell}}</button>
    <a class="rg-btn rg-btn--outline rg-btn--sm" href="#">{{icon:external-link}} Bekijk website</a>
  </div>
</div>
