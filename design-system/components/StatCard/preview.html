<!-- @dsCard group="CMS" height=330 subtitle="Dashboard counts in condensed numerals, with an optional 12-week bar in step blocks" -->
<div class="rg sg-stack">
  <div class="sg-pad" data-theme="light">
    <div class="rg-stats">
      <div class="rg-stat"><span class="rg-stat__label">Nieuwe aanvragen {{icon:inbox}}</span><span class="rg-stat__value">3</span><span class="rg-stat__note">Laatste: vandaag, 09:14</span></div>

        </div>
      </div>
      <div class="rg-stat"><span class="rg-stat__label">Realisaties online {{icon:images}}</span><span class="rg-stat__value">24</span><span class="rg-stat__note">2 concepten, 1 gepland</span></div>
    </div>
    <p class="sg-example" style="margin-top: 8px">Example data</p>
  </div>
  <div class="sg-pad" data-theme="dark">
    <div class="rg-stats">
      <div class="rg-stat"><span class="rg-stat__label">Nieuwe aanvragen {{icon:inbox}}</span><span class="rg-stat__value">3</span><span class="rg-stat__note">Laatste: vandaag, 09:14</span></div>
      <div class="rg-stat"><span class="rg-stat__label">Foto's zonder alt-tekst {{icon:triangle-alert}}</span><span class="rg-stat__value">2</span><span class="rg-stat__note"><a href="#">Nu aanvullen</a></span></div>
    </div>
  </div>
</div>
