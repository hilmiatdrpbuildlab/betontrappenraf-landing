<!-- @dsCard group="Feedback" height=420 subtitle="Short confirmations on the inverse surface, with undo and close; on Light and Dark" -->
<div class="rg sg-stack">
  <div class="sg-pad" data-theme="light">
    <div class="rg-toasts" aria-live="polite">
      <div class="rg-toast rg-toast--success" role="status">{{icon:circle-check}}<p class="rg-toast__text"><b>Opgeslagen.</b> De realisatie staat online.</p><div class="rg-toast__actions"><button class="rg-toast__close" type="button" aria-label="Sluiten" data-rg-dismiss>{{icon:x}}</button></div></div>
      <div class="rg-toast" role="status">{{icon:trash-2}}<p class="rg-toast__text">3 foto's verwijderd.</p><div class="rg-toast__actions"><button class="rg-toast__action" type="button">Ongedaan maken</button><button class="rg-toast__close" type="button" aria-label="Sluiten" data-rg-dismiss>{{icon:x}}</button></div></div>
      <div class="rg-toast rg-toast--danger" role="alert">{{icon:circle-x}}<p class="rg-toast__text"><b>Niet verstuurd.</b> Controleer uw verbinding en probeer opnieuw.</p><div class="rg-toast__actions"><button class="rg-toast__action" type="button">Opnieuw</button></div></div>
    </div>
  </div>
  <div class="sg-pad" data-theme="dark">
    <div class="rg-toasts" aria-live="polite">
      <div class="rg-toast rg-toast--success" role="status">{{icon:circle-check}}<p class="rg-toast__text"><b>Opgeslagen.</b> De realisatie staat online.</p><div class="rg-toast__actions"><button class="rg-toast__close" type="button" aria-label="Sluiten" data-rg-dismiss>{{icon:x}}</button></div></div>
      <div class="rg-toast rg-toast--info" role="status">{{icon:info}}<p class="rg-toast__text">Concept automatisch bewaard.</p><div class="rg-toast__actions"></div></div>
    </div>
  </div>
</div>
